apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello
  template:
    metadata:
      labels:
        app: hello
    spec:
      containers:
        - name: hello
          # перед первым push сюда ставится тег, собранный в части 1; дальше строку меняет только CI
          image: registry.registry.svc.cluster.local:5000/hello:7eedb8d4
          ports:
            - containerPort: 8000
