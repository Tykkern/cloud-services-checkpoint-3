apiVersion: v1
kind: Namespace
metadata:
  name: gitlab
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitlab-data
  namespace: gitlab
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab
  namespace: gitlab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gitlab
  template:
    metadata:
      labels:
        app: gitlab
    spec:
      containers:
        - name: gitlab
          image: gitlab/gitlab-ce:19.5.3-ce.0
          ports:
            - containerPort: 8930
          env:
            # пароль root задаётся секретом gitlab-root, его создаёт scripts/setup.ps1
            - name: GITLAB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gitlab-root
                  key: password
            - name: GITLAB_OMNIBUS_CONFIG
              value: |
                external_url 'http://localhost:8930'
                puma['worker_processes'] = 0
                sidekiq['concurrency'] = 5
                prometheus_monitoring['enable'] = false
                registry['enable'] = false
                gitlab_kas['enable'] = false
                letsencrypt['enable'] = false
          readinessProbe:
            httpGet:
              path: /users/sign_in
              port: 8930
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 60
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              memory: 6Gi
          volumeMounts:
            - name: data
              mountPath: /etc/gitlab
              subPath: config
            - name: data
              mountPath: /var/opt/gitlab
              subPath: data
            - name: data
              mountPath: /var/log/gitlab
              subPath: logs
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gitlab-data
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gitlab
  namespace: gitlab
spec:
  type: NodePort
  selector:
    app: gitlab
  ports:
    - name: http
      port: 8930
      targetPort: 8930
      nodePort: 30930
