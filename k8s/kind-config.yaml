kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kt3
nodes:
  - role: control-plane
    extraPortMappings:
      # GitLab (NodePort 30930) и registry (NodePort 30500) доступны с хоста
      - containerPort: 30930
        hostPort: 8930
        listenAddress: "127.0.0.1"
      - containerPort: 30500
        hostPort: 5030
        listenAddress: "127.0.0.1"
# containerd ищет настройки зеркал в certs.d: так нода сможет тянуть образы из registry внутри кластера
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
